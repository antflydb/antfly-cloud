# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: oapi
output: oapi/client.gen.go
generate:
  embedded-spec: true
  models: true
  client: true
compatibility:
  always-prefix-enum-values: true
output-options:
  include-operation-ids:
    - getCloudCapabilities
    - createCloudInstance
    - startLiteImport
    - getLiteOperation
    - createLiteUploadSession
    - sealLiteUpload
    - cancelLiteOperation
    - confirmLiteImport
    - startLiteExport
    - createLiteDownload
    - resumeLiteInstance
    - getCurrentUser
    - listOrganizations
    - getOrganization
    - listOrganizationMembers
    - inviteOrganizationMember
    - updateMemberRole
    - updateMemberMetadata
    - removeOrganizationMember
    - revokeInvitation
    - resendInvitation
    - estimateCloudCredits
    - listCloudInstances
    - getCloudInstance
    - updateCloudInstance
    - getCloudInstanceConnection
    - listCloudInstanceEvents
    - getCloudInstanceMetrics
    - getCloudBrowserAccess
    - updateCloudBrowserAccess
    - listCloudBrowserAccessTables
    - createCloudAPIKey
    - getCloudUsage
    - getAntflyInferenceUsageSummary
    - listAntflyInferenceRequestLogs
    - getAntflyInferenceDailyCost
    - listCloudGroups
    - createCloudGroup
    - updateCloudGroup
    - getCloudUserAttributes
    - updateCloudUserAttributes
    - syncCloudSCIMGroups
    - listCloudGroupMembers
    - addCloudGroupMember
    - removeCloudGroupMember
    - listCloudGrants
    - upsertCloudGrant
    - deleteCloudGrant
    - listSourceConnections
    - authorizeSourceInstallation
    - startSourceInstallation
    - getSourceInstallationStatus
    - listSourceResources
    - previewConnectedSource
    - listConnectedSourceJobs
    - createConnectedSource
    - syncConnectedSource
  prefer-skip-optional-pointer: true
  prefer-skip-optional-pointer-with-omitzero: true
