# Publish packages to npm when tagged
# - ts/antfly/cloud-sdk/v* tags publish @antfly/cloud-sdk
#
# Uses npm Trusted Publishing (OIDC) - no secrets required.
# Configure trusted publisher at: https://www.npmjs.com/package/@antfly/cloud-sdk/access

name: Publish to npm

on:
  push:
    tags:
      - "ts/antfly/cloud-sdk/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        working-directory: ts
        run: pnpm build

      - name: Check types
        working-directory: ts
        run: pnpm check-types

      - name: Run tests
        working-directory: ts
        run: pnpm test

      - name: Upgrade npm for OIDC support
        run: npm install --global npm@12.2.1

      - name: Publish SDK
        working-directory: ts
        run: pnpm --filter @antfly/cloud-sdk publish --access public --no-git-checks --provenance
