name: Antfly Cloud CLI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: 'off'

jobs:
  build:
    name: Test and prepare release for approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_sha256: ${{ steps.payload.outputs.sha256 }}
      prerelease: ${{ steps.payload.outputs.prerelease }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the tagged commit to belong to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release/cloud_cli.py validate-ref --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Test release integrity controls
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run Antfly Cloud CLI tests
        working-directory: go
        run: go test ./...
      - name: Build and package without publishing credentials
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: goreleaser
          version: "v2.19.0"
          workdir: go
          args: release --clean --skip=validate,publish
      - name: Record the exact release payload
        id: payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          digest="$(python scripts/release/cloud_cli.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo "## Release awaiting approval"
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $RELEASE_COMMIT"
            echo "Payload manifest SHA256: $digest"
            echo "Review the release artifact before approving publication."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: cloud-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Approve and publish prepared release
    needs: build
    runs-on: arc-antfly-publish
    timeout-minutes: 15
    concurrency:
      group: antfly-cloud-cli-publication
      cancel-in-progress: false
    environment:
      name: antfly-cloud-cli-release
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Recheck the approved tag still belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release/cloud_cli.py validate-ref --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release-payload
      - name: Verify the approved payload before loading credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: python scripts/release/cloud_cli.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Install hash-locked object storage client
        run: python -m pip install --require-hashes -r scripts/release/requirements.lock
      - name: Create stable Homebrew publishing token
        if: needs.build.outputs.prerelease != 'true'
        id: homebrew-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: antflydb
          repositories: homebrew-taps
          permission-contents: write
      - name: Publish the approved files to R2 and Homebrew
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        run: python scripts/release/cloud_cli.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --manifest-sha256 "$MANIFEST_SHA256"
