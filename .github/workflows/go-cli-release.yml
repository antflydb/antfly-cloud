name: Antfly Cloud CLI Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: 'off'

jobs:
  build:
    name: Test and prepare release payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the tagged commit to belong to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release/cloud_cli.py validate-ref --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Test release integrity controls
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run Antfly Cloud CLI tests
        working-directory: go
        run: go test ./...
      - name: Build and package without publishing credentials
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A stable tag and an RC tag can point to the same commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        with:
          distribution: goreleaser
          version: "v2.19.0"
          workdir: go
          args: release --clean --skip=validate,publish
      - name: Record the exact release payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          digest="$(python scripts/release/cloud_cli.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT")"
          {
            echo "## Prepared release payload"
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $RELEASE_COMMIT"
            echo "Payload manifest SHA256: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 14
