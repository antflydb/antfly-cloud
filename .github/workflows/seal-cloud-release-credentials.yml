name: Seal Cloud release credentials for environment migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main' && github.actor == 'ajroetker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked encryption library
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/credential-migration-requirements.txt
      - name: Encrypt directly to the GitHub environment public key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          python - <<'PYTHON'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import encoding, public

          key = public.PublicKey('FqFYtKhkDCQ8RtjfbXIYol0E5jmXirctxMUXswKGpg4=', encoding.Base64Encoder())
          box = public.SealedBox(key)
          sealed = {}
          for name in ['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_ENDPOINT_URL']:
              value = os.environ[name]
              if not value:
                  raise SystemExit('Missing required credential: ' + name)
              sealed[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()}
          Path('sealed-secrets.json').write_text(json.dumps(sealed))
          print('Three credential values sealed to the protected GitHub environment key.')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-release-sealed-credentials
          path: sealed-secrets.json
          if-no-files-found: error
          retention-days: 1
