openapi: 3.0.3
info:
  title: Antfly Cloud Platform API
  description: Public management APIs for Antfly Cloud organizations, billing, authentication, hosted instances, Cloud RBAC, backups, metrics, and usage.
  version: 1.0.0
  contact:
    name: Antfly Cloud Support
    url: https://platform.antfly.io
  license:
    name: Proprietary
servers:
  - url: https://platform.antfly.io/api/v1
    description: Production
tags:
  - name: Instances
    description: Cloud instance lifecycle management
  - name: CloudAPIKeys
    description: API key management for cloud instances
  - name: CloudTables
    description: Logical table registry for cloud instances
  - name: CloudMetrics
    description: Instance metrics and events
  - name: CloudBackups
    description: Backup and restore management for cloud instances
  - name: CloudRBAC
    description: Cloud instance groups and grants
  - name: CloudBilling
    description: Cloud committed-capacity billing and credits
paths:
  /organizations/{org_id}/cloud/estimate:
    post:
      summary: Estimate cloud credits
      description: Estimate cloud credit usage and spend-limit impact for a prospective cloud operation.
      operationId: estimateCloudCredits
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudCreditEstimateRequest'
      responses:
        '200':
          description: Cloud credit estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCreditEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{org_id}/cloud/commitments:
    get:
      summary: List cloud billing commitments
      description: List committed-capacity charges and refunds for cloud instances.
      operationId: listCloudCommitments
      tags:
        - CloudBilling
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: instance_id
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
          description: Optional cloud instance filter
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cloud billing commitments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingCommitmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{org_id}/cloud/instances:
    get:
      summary: List cloud instances
      description: List all cloud instances for an organization
      operationId: listCloudInstances
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cloud instances
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudInstance'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create cloud instance
      description: |
        Create a new hosted AntflyDB instance. Provisioning is asynchronous —
        the instance is created with status=pending and a dedicated cluster is
        provisioned in the background.
      operationId: createCloudInstance
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudInstanceRequest'
      responses:
        '201':
          description: Provisioning started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{org_id}/cloud/instances/{instance_id}:
    get:
      summary: Get cloud instance
      description: Get cloud instance details including status and connection info
      operationId: getCloudInstance
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Cloud instance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update cloud instance
      description: Update instance configuration (rename, scale)
      operationId: updateCloudInstance
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudInstanceRequest'
      responses:
        '200':
          description: Cloud instance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete cloud instance
      description: |
        Delete a cloud instance. Deprovisioning is asynchronous — the instance
        status is set to deprovisioning and the dedicated cluster is cleaned up
        in the background.
      operationId: deleteCloudInstance
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202':
          description: Deletion accepted (may be async for dedicated clusters)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/provider-auths/{auth_id}/objects:
    get:
      summary: List S3 objects for a cloud instance credential
      description: Lists immediate prefixes and objects for a bucket/prefix authorized by the selected S3 credential. Responses may be truncated when the requested limit is reached.
      operationId: listCloudInstanceProviderAuthObjects
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/AuthId'
        - name: bucket
          in: query
          required: true
          schema:
            type: string
          description: Allowed bucket name to list.
        - name: prefix
          in: query
          schema:
            type: string
          description: Optional object key prefix.
        - name: recursive
          in: query
          schema:
            type: boolean
            default: false
          description: Whether to list recursively instead of returning immediate prefixes.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Maximum number of object entries to return.
      responses:
        '200':
          description: Bucket object listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3ObjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/import-jobs/{job_id}/pause:
    post:
      summary: Pause import job
      operationId: pauseImportJob
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Import job paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/import-jobs/{job_id}/resume:
    post:
      summary: Resume import job
      operationId: resumeImportJob
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Import job resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/import-jobs/{job_id}/archive:
    post:
      summary: Archive import job
      operationId: archiveImportJob
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Import job archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/import-jobs/{job_id}:
    delete:
      summary: Archive import job
      description: Archives the import job while retaining run history. This is an alias for the archive action.
      operationId: deleteImportJob
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Import job archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/provision:
    post:
      summary: Provision cloud instance
      description: |
        Retry or repair provisioning for an existing cloud instance. This action
        reconciles existing infrastructure in place and does not delete the
        instance namespace, CRD, or persistent volumes.
      operationId: provisionCloudInstance
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Provisioning already active or instance already ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstance'
        '202':
          description: Provisioning accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{org_id}/cloud/instances/{instance_id}/ha/status-sync:
    post:
      summary: Sync hot-standby HA status
      description: |
        Queue an immediate Cloud reconciliation pass so Cloud pulls the latest
        operator-observed hot-standby HA status, planned actions, fencing state,
        route state, and promotion blockers into the public instance status.
      operationId: syncCloudInstanceHAStatus
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202':
          description: HA status sync queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudHAStatusSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{org_id}/cloud/instances/{instance_id}/tables:
    get:
      summary: List cloud instance tables
      description: List logical tables registered for a cloud instance.
      operationId: listCloudInstanceTables
      tags:
        - CloudTables
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Cloud instance tables
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudInstanceTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create cloud instance table
      description: Register and create a table in the cloud instance.
      operationId: createCloudInstanceTable
      tags:
        - CloudTables
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudInstanceTableRequest'
      responses:
        '201':
          description: Cloud instance table created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudInstanceTable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/groups:
    get:
      summary: List cloud groups
      operationId: listCloudGroups
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Cloud groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudGroup'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create cloud group
      operationId: createCloudGroup
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudGroupRequest'
      responses:
        '201':
          description: Cloud group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{org_id}/cloud/groups/{group_id}:
    patch:
      summary: Update cloud group
      operationId: updateCloudGroup
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudGroupRequest'
      responses:
        '200':
          description: Cloud group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/users/{user_id}/attributes:
    get:
      summary: Get cloud user attributes
      operationId: getCloudUserAttributes
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Cloud user attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudUserAttributes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update cloud user manual attributes
      operationId: updateCloudUserAttributes
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloudUserAttributesRequest'
      responses:
        '200':
          description: Cloud user attributes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudUserAttributes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/scim/groups:
    put:
      summary: Sync SCIM cloud groups
      description: Upsert SCIM-managed groups and replace their membership snapshots for an organization.
      operationId: syncCloudSCIMGroups
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudSCIMGroupSyncRequest'
      responses:
        '200':
          description: SCIM groups synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSCIMGroupSyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{org_id}/cloud/groups/{group_id}/members:
    get:
      summary: List cloud group members
      operationId: listCloudGroupMembers
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Cloud group members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudGroupMember'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add cloud group member
      operationId: addCloudGroupMember
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCloudGroupMemberRequest'
      responses:
        '201':
          description: Group member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/groups/{group_id}/members/{user_id}:
    delete:
      summary: Remove cloud group member
      operationId: removeCloudGroupMember
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/GroupId'
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Group member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/grants:
    get:
      summary: List cloud grants
      operationId: listCloudGrants
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Cloud grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudGrant'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Upsert cloud grant
      operationId: upsertCloudGrant
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCloudGrantRequest'
      responses:
        '200':
          description: Cloud grant upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{org_id}/cloud/instances/{instance_id}/grants/{grant_id}:
    delete:
      summary: Delete cloud grant
      operationId: deleteCloudGrant
      tags:
        - CloudRBAC
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InstanceId'
        - name: grant_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Cloud grant deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{org_id}/cloud/instances/{instance_id}/connection:
    get:
      summary: Get connection details
      description: Get connection URL and instructions for connecting to the instance
      operationId: getCloudInstanceConnection
      tags:
        - Instances
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
