    CloudCreditEstimateRequest:
      type: object
      required:
        - operation
      properties:
        operation:
          type: string
          enum:
            - create_instance
            - update_instance
          description: Cloud operation being estimated
        instance_id:
          $ref: '#/components/schemas/UUID'
          description: Required for update_instance estimates.
        tier:
          $ref: '#/components/schemas/CloudInstanceTier'
          default: standard
        mode:
          $ref: '#/components/schemas/CloudInstanceMode'
          default: single
        ha_config:
          x-go-type-skip-optional-pointer: false
          type: object
          allOf:
            - $ref: '#/components/schemas/CloudHAConfig'
          nullable: true
        node_config:
          $ref: '#/components/schemas/NodeConfigUpdate'
        region:
          type: string
          default: us-central1
          description: Cloud region for the estimate
        hours_per_month:
          type: integer
          minimum: 1
          maximum: 744
          default: 730
          description: Monthly hours used for the estimate
    CloudCreditEstimateMetric:
      type: object
      required:
        - metric_type
        - quantity
        - credit_units
        - display_value
        - display_unit
      properties:
        metric_type:
          type: string
          description: Internal raw usage metric being rated
          example: cloud_cpu_core_hour
        quantity:
          type: integer
          minimum: 0
          description: Internal metric quantity used for rating
        credit_units:
          type: integer
          minimum: 0
          description: Rated credit units for this metric
        display_value:
          type: number
          format: double
          description: Customer-readable usage quantity
        display_unit:
          type: string
          description: Customer-readable usage unit
          example: core-hours
    CloudCreditEstimate:
      type: object
      required:
        - operation
        - tier
        - mode
        - region
        - hours_per_month
        - allowed
        - credit_units
        - estimated_cents
        - monthly_package_cents
        - monthly_commitment_cents
        - prorated_package_cents
        - delta_cents
        - baseline_backfill_cents
        - covered_credit_units
        - overage_credit_units
        - balance_before
        - cloud_overage_enabled
        - metrics
      properties:
        operation:
          type: string
          enum:
            - create_instance
            - update_instance
        tier:
          $ref: '#/components/schemas/CloudInstanceTier'
        mode:
          $ref: '#/components/schemas/CloudInstanceMode'
        region:
          type: string
        hours_per_month:
          type: integer
        allowed:
          type: boolean
        reason:
          type: string
        credit_units:
          type: integer
          minimum: 0
        estimated_cents:
          type: integer
          minimum: 0
          description: Same value as credit_units because 1 cloud credit unit equals 1 cent
        monthly_package_cents:
          type: integer
          minimum: 0
          description: Full-month package floor for the selected tier.
        monthly_commitment_cents:
          type: integer
          minimum: 0
          description: Full-month committed-capacity estimate for the selected topology and node configuration.
        prorated_package_cents:
          type: integer
          minimum: 0
          description: Package floor portion for the estimated billing window.
        delta_cents:
          type: integer
          description: Signed committed-capacity delta for the estimated operation.
        baseline_backfill_cents:
          type: integer
          minimum: 0
          description: Full-cycle baseline charge that must be recorded before the requested update delta because the instance has no current-cycle baseline coverage.
        covered_credit_units:
          type: integer
          minimum: 0
        overage_credit_units:
          type: integer
          minimum: 0
        balance_before:
          type: integer
          minimum: 0
        cloud_overage_enabled:
          type: boolean
        spend_allowed:
          type: boolean
          description: Whether projected overage passes the current spend limit
        spend_limit_remaining_cents:
          type: integer
          minimum: 0
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CloudCreditEstimateMetric'
    CloudInstanceUsage:
