components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from OAuth flow or API key
  schemas:
    CloudInstanceStatus:
      type: string
      enum:
        - pending
        - provisioning
        - ready
        - updating
        - degraded
        - suspended
        - deprovisioning
        - deleted
        - failed
      description: Instance lifecycle status
    CloudInstanceVersionPolicy:
      type: string
      enum:
        - pinned
        - patch_auto
        - minor_auto
        - major_manual
      description: Antfly runtime version policy for managed upgrades.
    CloudInstanceVersionUpgradeStatus:
      type: string
      enum:
        - idle
        - pending
        - rolling
        - failed
        - blocked
      description: Antfly runtime rollout status.
    CloudInstanceMode:
      type: string
      enum:
        - single
        - distributed
      description: Cloud deployment topology. `single` provisions one Swarm Antfly node; `distributed` provisions separate Raft-backed metadata and data node groups.
    CloudHAFencingAuthority:
      type: string
      enum:
        - none
        - kubernetes_lease
      description: Fencing authority used for hot-standby promotion decisions.
    CloudHASyncMode:
      type: string
      enum:
        - async
        - remote_write
        - remote_apply
      description: Standby durability mode for hot-standby replication.
    CloudHAHealth:
      type: string
      enum:
        - disabled
        - provisioning
        - healthy
        - degraded
        - unhealthy
        - lagging
        - reseed_required
        - promoting
      description: Cloud-visible hot-standby health state.
    CloudHAConfig:
      type: object
      description: Hot-standby HA add-on configuration. Supported only with `mode=single`; distributed mode is the separate Raft-backed topology.
      properties:
        enabled:
          type: boolean
          default: false
          description: Enables one primary with hot standby replica nodes.
        standby_count:
          type: integer
          minimum: 1
          maximum: 26
          default: 1
          description: Desired hot standby replica count when HA is enabled.
        automatic_failover_enabled:
          type: boolean
          default: false
          description: Allows fenced operator-managed automatic promotion when prerequisites are satisfied.
        fencing_authority:
          $ref: '#/components/schemas/CloudHAFencingAuthority'
          default: kubernetes_lease
        sync_mode:
          $ref: '#/components/schemas/CloudHASyncMode'
          default: remote_apply
        maximum_lag_lsn:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Maximum tolerated standby lag for automatic promotion. Zero uses operator/runtime defaults.
    CloudHAStandbyStatus:
      type: object
      description: Observed hot-standby replica status.
      properties:
        name:
          type: string
        slot_name:
          type: string
        node_id:
          type: string
        health:
          $ref: '#/components/schemas/CloudHAHealth'
        received_lsn:
          type: integer
          format: int64
          minimum: 0
        applied_lsn:
          type: integer
          format: int64
          minimum: 0
        safe_read_lsn:
          type: integer
          format: int64
          minimum: 0
        lag_lsn:
          type: integer
          format: int64
          minimum: 0
        reseed_required:
          type: boolean
    CloudHAPlannedActionStatus:
      type: object
      description: Cloud-visible summary of one operator-planned HA workflow action.
      properties:
        kind:
          type: string
        phase:
          type: string
        executor:
          type: string
        depends_on:
          type: string
        reason:
          type: string
        standby_name:
          type: string
        slot_name:
          type: string
        target_lsn:
          type: integer
          format: int64
          minimum: 0
        observed_lsn:
          type: integer
          format: int64
          minimum: 0
        retained_from_lsn:
          type: integer
          format: int64
          minimum: 0
        route_from:
          type: string
        route_to:
          type: string
        fence_authority:
          $ref: '#/components/schemas/CloudHAFencingAuthority'
        fence_holder:
          type: string
        fence_generation:
          type: integer
          format: int64
          minimum: 0
        admin_method:
          type: string
        admin_path:
          type: string
        admin_job_name:
          type: string
        admin_job_phase:
          type: string
        admin_error:
          type: string
        rejoin_action:
          type: string
          description: Former-primary rejoin action reported by the typed HA admin workflow, such as rewind or reseed.
        rejoin_reason:
          type: string
          description: Reason the operator/admin workflow selected the former-primary rejoin action.
        former_node_id:
          type: string
          description: Former primary node ID reported by the typed HA admin workflow.
    CloudHAFormerPrimaryStatus:
      type: object
      description: Cloud-visible former-primary rejoin/rewind/reseed disposition after a hot-standby promotion.
      properties:
        node_id:
          type: string
        fenced:
          type: boolean
        rejoin_required:
          type: boolean
        rewind_possible:
          type: boolean
        reseed_required:
          type: boolean
        diverged:
          type: boolean
        parent_timeline_id:
          type: integer
          format: int64
          minimum: 0
        new_timeline_id:
          type: integer
          format: int64
          minimum: 0
        observed_timeline_id:
          type: integer
          format: int64
          minimum: 0
        switch_lsn:
          type: integer
          format: int64
          minimum: 0
        observed_lsn:
          type: integer
          format: int64
          minimum: 0
        fence_authority:
          $ref: '#/components/schemas/CloudHAFencingAuthority'
        fence_holder:
          type: string
        fence_generation:
          type: integer
          format: int64
